name: ci

# Two-tier CI:
#   - `unit`: fast — builds, lints, runs the unit suite. Every push + PR.
#   - `kind-e2e`: slow — spins up a real cluster and verifies the kubectl
#     commands our wrappers emit. Only on push-to-main and manual dispatch
#     (skip for PRs by default to keep iteration fast).
#
# Both jobs set PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD so npm ci doesn't pull
# ~700MB of browsers. Playwright tests have their own job below.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  unit:
    name: build + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install (skip Playwright browsers)
        run: npm ci --no-audit --no-fund

      - name: Build (vite)
        run: npm run build

      - name: Unit tests (vitest)
        run: npm test

  kind-e2e:
    name: kind cluster e2e
    needs: unit
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Real-cluster verification is best-effort — flakes on Argo install / Chaos
    # Mesh release URLs / kind-action versions shouldn't block the unit gate.
    # The unit job is the merge-blocking gate; this one tells us when our
    # kubectl wrappers diverge from real behavior.
    continue-on-error: true
    env:
      ARGO_ROLLOUTS_VERSION: 'v1.7.2'
      CHAOS_MESH_VERSION: 'v2.7.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Set up kind
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: agenticops-e2e
          wait: 120s
          version: v0.23.0
          node_image: kindest/node:v1.30.0

      - name: Show cluster info
        run: |
          set -x
          kubectl cluster-info
          kubectl get nodes -o wide

      - name: Apply baseline fixtures (no CRDs needed)
        run: |
          set -euo pipefail
          cat <<'EOF' | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: e2e-app
            labels: { app: e2e-app }
          spec:
            replicas: 2
            selector: { matchLabels: { app: e2e-app } }
            template:
              metadata: { labels: { app: e2e-app } }
              spec:
                containers:
                - name: web
                  image: nginx:1.25
                  ports: [{ containerPort: 80 }]
          EOF
          kubectl rollout status deployment/e2e-app --timeout=180s

      - name: Verify kubectl set image (mirrors server/k8s.js)
        run: |
          set -euo pipefail
          kubectl set image deployment/e2e-app web=nginx:1.27
          kubectl rollout status deployment/e2e-app --timeout=180s
          kubectl get deployment e2e-app -o jsonpath='{.spec.template.spec.containers[0].image}' | grep -q nginx:1.27

      - name: Verify kubectl apply -k (mirrors server/gitops.js)
        run: |
          set -euo pipefail
          mkdir -p /tmp/manifests
          cat > /tmp/manifests/kustomization.yaml <<'EOF'
          resources: [./configmap.yaml]
          EOF
          cat > /tmp/manifests/configmap.yaml <<'EOF'
          apiVersion: v1
          kind: ConfigMap
          metadata: { name: e2e-gitops-config }
          data: { foo: bar }
          EOF
          kubectl apply -k /tmp/manifests
          kubectl get configmap e2e-gitops-config -o jsonpath='{.data.foo}' | grep -q bar

      # Argo Rollouts + Chaos Mesh tests live in their own steps below — each
      # is `continue-on-error: true` so a flaky third-party install doesn't
      # cascade into the wrappers we actually need to verify.

      - name: Install Argo Rollouts (best-effort)
        continue-on-error: true
        run: |
          set -euo pipefail
          kubectl create namespace argo-rollouts || true
          kubectl apply -n argo-rollouts -f \
            https://github.com/argoproj/argo-rollouts/releases/download/${ARGO_ROLLOUTS_VERSION}/install.yaml
          kubectl -n argo-rollouts rollout status deployment/argo-rollouts --timeout=180s
          kubectl get crd rollouts.argoproj.io -o name

      - name: Verify Argo Rollouts patch (mirrors server/argo.js)
        continue-on-error: true
        run: |
          set -euo pipefail
          # Skip if the Rollout CRD wasn't installed.
          kubectl get crd rollouts.argoproj.io >/dev/null 2>&1 || { echo "::warning::Argo Rollouts CRD not installed; skipping"; exit 0; }
          cat <<'EOF' | kubectl apply -f -
          apiVersion: argoproj.io/v1alpha1
          kind: Rollout
          metadata: { name: e2e-rollout }
          spec:
            replicas: 2
            selector: { matchLabels: { app: e2e-rollout } }
            template:
              metadata: { labels: { app: e2e-rollout } }
              spec:
                containers:
                - { name: web, image: nginx:1.25 }
            strategy:
              canary:
                steps:
                - setWeight: 50
                - pause: { duration: 5 }
          EOF
          # Wait for the rollout to land Healthy by polling phase, NOT
          # `kubectl wait --for=condition=Available` (Rollouts don't have
          # that condition).
          for i in $(seq 1 24); do
            phase=$(kubectl get rollout e2e-rollout -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
            echo "phase=$phase ($i/24)"
            [ "$phase" = "Healthy" ] && break
            sleep 5
          done
          kubectl patch rollout e2e-rollout --type=merge -p \
            '{"spec":{"template":{"spec":{"containers":[{"name":"web","image":"nginx:1.27"}]}}}}'
          kubectl get rollout e2e-rollout -o jsonpath='{.spec.template.spec.containers[0].image}' | grep -q nginx:1.27

      - name: Install Chaos Mesh CRDs only (best-effort)
        continue-on-error: true
        run: |
          set -euo pipefail
          # We only need the CRDs to verify our generator's YAML is accepted.
          # Skip the full control plane install (heavier + flakier in CI).
          kubectl apply -f \
            "https://raw.githubusercontent.com/chaos-mesh/chaos-mesh/${CHAOS_MESH_VERSION}/manifests/crd.yaml" \
            || true
          kubectl get crd podchaos.chaos-mesh.org >/dev/null 2>&1 \
            && echo "CRDs installed" \
            || echo "::warning::Chaos Mesh CRDs not installed at ${CHAOS_MESH_VERSION}/manifests/crd.yaml"

      - name: Verify Chaos Mesh CRD apply (mirrors server/chaos-mesh.js)
        continue-on-error: true
        run: |
          set -euo pipefail
          kubectl get crd podchaos.chaos-mesh.org >/dev/null 2>&1 || { echo "::warning::Chaos Mesh CRDs missing; skipping"; exit 0; }
          cat <<'EOF' | kubectl apply -f -
          apiVersion: chaos-mesh.org/v1alpha1
          kind: PodChaos
          metadata:
            name: aops-e2e-pod-kill
            labels: { app.kubernetes.io/managed-by: agenticops }
          spec:
            action: pod-kill
            mode: one
            selector: { labelSelectors: { app: e2e-app } }
            duration: 5s
          EOF
          kubectl get podchaos aops-e2e-pod-kill -o jsonpath='{.spec.action}' | grep -q pod-kill
          kubectl delete podchaos aops-e2e-pod-kill --ignore-not-found

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "=== Cluster events ==="
          kubectl get events --sort-by=.lastTimestamp 2>/dev/null | tail -50 || true
          echo "=== Argo Rollouts pods ==="
          kubectl -n argo-rollouts get pods 2>/dev/null || echo "no argo-rollouts ns"
          kubectl -n argo-rollouts logs deployment/argo-rollouts --tail=100 2>/dev/null || true
          echo "=== Chaos Mesh CRDs ==="
          kubectl get crd 2>/dev/null | grep chaos-mesh || echo "no chaos-mesh CRDs"
